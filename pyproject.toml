[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codon-amino-acid-taxonomy" 
version = "0.1.0"
description = "Machine learning project predicting taxonomic group on the basis of codon and amino acid frequencies"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"} 
authors = [
    {name = "Stephen Kizlik", email = "stephen.kizlik@gmail.com"}
]
keywords = ["bioinformatics", "machine-learning", "codon-usage"] 
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.6.0",
    "hyperopt>=0.2.7",
    "shap>=0.41.0",
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
    "pre-commit>=2.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/skizlik/codon-amino-acid-taxonomy"  
Repository = "https://github.com/skizlik/codon-amino-acid-taxonomy" 

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | notebooks
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
skip = ["notebooks"]
